<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>관람 후 설문</title>
<meta property="og:title" content="김정수필름 테스트 스크리닝 · 관람 후 설문">
<meta property="og:description" content="3분이면 끝납니다. 솔직한 반응이 다음 편집에 그대로 들어갑니다.">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* 예매 페이지와 같은 극장 톤. 작품별 카드 3장 → 전체 질문 → 제출 */
:root{
  --bg:#0f0e0d; --panel:#1a1816; --line:#2c2925; --fg:#efe9e1; --mute:#9a938a;
  --seat:#e2672b; --mine:#f4d35e; --err:#ff6b6b;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"Space Mono",ui-monospace,Menlo,monospace; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--seat)}
h1{font-size:28px;line-height:1.3;margin:6px 0 4px;font-weight:900;text-wrap:balance}
.sub{color:var(--mute);margin:0 0 20px}
.film{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:16px;margin-top:14px}
.film h2{font-size:18px;margin:0}
.film .meta{font-family:var(--mono);font-size:12px;color:var(--mute)}
.stars{display:flex;gap:6px;margin:12px 0 4px}
.stars button{width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--mute);font:700 15px var(--mono);cursor:pointer}
.stars button.on{background:var(--seat);border-color:var(--seat);color:#1a0d05}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);max-width:262px}
h3{font-size:17px;margin:30px 0 4px}
label{display:block;font-size:14px;color:var(--mute);margin:14px 0 6px}
input,select,textarea{width:100%;font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--seat);outline-offset:1px}
.nps{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.nps button{padding:10px 0;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--fg);font:700 13px var(--mono);cursor:pointer}
.nps button.on{background:var(--seat);color:#1a0d05;border-color:var(--seat)}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:14px;color:var(--mute)}
.check input{width:20px;height:20px;margin-top:2px;flex:none}
.btn{display:block;width:100%;margin-top:24px;padding:15px;border:0;border-radius:12px;font:inherit;font-weight:700;font-size:17px;background:var(--seat);color:#1a0d05;cursor:pointer}
.btn:disabled{opacity:.5}
.msg{margin-top:14px;padding:12px;border-radius:10px;font-size:14px;background:#3a1a1a;color:var(--err)}
.thanks{text-align:center;padding-top:40px}
.thanks .big{font-size:40px;font-weight:900;color:var(--mine)}
.demo{margin-bottom:16px;padding:10px 12px;border:1px dashed var(--seat);border-radius:10px;font-size:13px;color:var(--seat)}
</style>
</head>
<body>
<main class="wrap">
  <div id="demo" class="demo" hidden>시트 연결 전 미리보기입니다. 여기서 낸 답은 저장되지 않습니다.</div>
  <div id="formWrap">
  <div class="eyebrow">TEST SCREENING · 11.21</div>
  <h1>오늘 본 세 편, 솔직하게 들려주세요</h1>
  <p class="sub">3분이면 끝납니다. 좋았던 점보다 걸렸던 점이 더 도움이 됩니다.</p>

  <form id="f" novalidate>
    <div id="films"></div>

    <h3>세 편을 다 보고 나서</h3>
    <label for="best">가장 좋았던 작품은?</label>
    <select id="best"><option value="">선택해 주세요</option><option>골디락스존 프로젝트</option><option>잡아먹히거나 먼저 씹어라</option><option>기름도둑</option></select>
    <label for="scene">가장 기억에 남는 장면 하나</label>
    <textarea id="scene" rows="2" placeholder="예: 옷장 문이 열리는 순간"></textarea>
    <label for="confuse">이해가 안 됐거나 헷갈린 부분이 있었나요?</label>
    <textarea id="confuse" rows="2" placeholder="없으면 비워 두셔도 됩니다"></textarea>

    <label>친구에게 이 작품들을 추천할 가능성은? <span id="npsV"></span></label>
    <div class="nps" id="nps"></div>
    <div class="scale" style="max-width:none"><span>0 전혀 아니다</span><span>10 꼭 추천</span></div>

    <label for="next">세 편이 한 세계관으로 이어진다는 게 느껴졌나요?</label>
    <select id="next"><option value="">선택해 주세요</option><option>네, 이어지는 게 보였어요</option><option>조금 느꼈어요</option><option>잘 모르겠어요</option><option>따로따로 봤어요</option></select>
    <label for="msg">감독에게 하고 싶은 말 (선택)</label>
    <textarea id="msg" rows="3"></textarea>
    <label for="nm">이름 (선택)</label>
    <input id="nm" autocomplete="name" placeholder="익명이어도 괜찮습니다">
    <label class="check"><input type="checkbox" id="quote"> <span>제가 쓴 한마디를 홍보물에 이름 없이 인용해도 좋습니다.</span></label>
    <div id="err" class="msg" hidden></div>
    <button class="btn" id="send" type="submit">설문 보내기</button>
  </form>
  </div>
  <div id="thanks" class="thanks" hidden>
    <div class="big">감사합니다</div>
    <p>보내 주신 반응은 다음 편집과 영화제 버전에 그대로 반영하겠습니다.</p>
  </div>
</main>
<script>
const API = "";
const FILMS = [
  {k:"1", t:"골디락스존 프로젝트", m:"17분 · SF 스릴러"},
  {k:"2", t:"잡아먹히거나 먼저 씹어라", m:"7분 · 파운드푸티지"},
  {k:"3", t:"기름도둑", m:"12분 · SF 디스토피아"}
];
const $ = id => document.getElementById(id);
const ans = {r1:0,r2:0,r3:0,nps:""};
if (!API) $("demo").hidden = false;

$("films").innerHTML = FILMS.map(f => `
  <div class="film">
    <h2>${f.t}</h2><div class="meta">${f.m}</div>
    <div class="stars" data-k="${f.k}" role="radiogroup" aria-label="${f.t} 별점">
      ${[1,2,3,4,5].map(n => `<button type="button" role="radio" aria-checked="false" data-v="${n}">${n}</button>`).join("")}
    </div>
    <div class="scale"><span>별로</span><span>최고</span></div>
    <label for="c${f.k}">한마디</label>
    <input id="c${f.k}" placeholder="떠오르는 대로">
  </div>`).join("");
document.querySelectorAll(".stars").forEach(g => g.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const v = +b.dataset.v; ans["r"+g.dataset.k] = v;
  g.querySelectorAll("button").forEach(x => { const on = +x.dataset.v <= v; x.classList.toggle("on", on); x.setAttribute("aria-checked", +x.dataset.v === v); });
}));
$("nps").innerHTML = Array.from({length:11}, (_, i) => `<button type="button" data-v="${i}">${i}</button>`).join("");
$("nps").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  ans.nps = b.dataset.v; $("npsV").textContent = "· " + b.dataset.v;
  $("nps").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
});
$("f").addEventListener("submit", async e => {
  e.preventDefault();
  if (!ans.r1 || !ans.r2 || !ans.r3){ $("err").textContent = "세 작품 모두 별점을 눌러 주세요."; $("err").hidden = false; return; }
  const body = {type:"survey", name:$("nm").value.trim(), r1:ans.r1, c1:$("c1").value.trim(), r2:ans.r2, c2:$("c2").value.trim(), r3:ans.r3, c3:$("c3").value.trim(),
    best:$("best").value, scene:$("scene").value.trim(), confuse:$("confuse").value.trim(), nps:ans.nps, next:$("next").value, msg:$("msg").value.trim(), quote:$("quote").checked};
  $("send").disabled = true; $("send").textContent = "보내는 중…";
  let ok = !API;
  if (API){ try { const r = await fetch(API, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(body)}); ok = (await r.json()).ok; } catch(x){ ok = false; } }
  if (!ok){ $("send").disabled = false; $("send").textContent = "설문 보내기"; $("err").textContent = "보내지 못했습니다. 잠시 후 다시 눌러 주세요."; $("err").hidden = false; return; }
  $("formWrap").hidden = true; $("thanks").hidden = false; window.scrollTo(0,0);
});
</script>
</body>
</html>
